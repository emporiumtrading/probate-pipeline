# Daily probate pipeline settings. Edit freely; the daily run reads this first.

owner_timezone: America/Chicago
dashboard_slug: 24accd17-df79-4cf5-a42f-e6451a61b8a0   # Probate Pipeline Dashboard (claude.ai artifact)
autonomy:
  outreach: autonomous            # owner decision 2026-11-25 ("switch everything ... fully autonomous; I only want to see money deposited"). Was drafts_only.
  outreach_decided_on: 2026-11-25 # the newer of this date and the Setup page's saved_at wins (scripts/owner_settings.py effective_outreach)
  # Per-market gates still apply, every message: a market sends only once it has attorney_approved: <date> (Legal Advisor's
  # approval steps), a working sending channel (channels.mail_sending / email_sending tested), the Compliance Officer's PASS,
  # and the 90-day wait after the date of death. A market missing any of these keeps its letters as held drafts: they are
  # not put in the owner's queue; they go out on their own once the market's gates open.
  negotiation_limit: mao          # the Negotiator negotiates all the way up to each deal's max offer; nothing binds until the owner signs
  engage_professionals: select_within_limits   # owner decision 2026-11-25: the Professional Network requests quotes, picks the best firm within the limits below and puts its engagement letter in the owner's Sign queue
  attorney_template_fee_max: 1500 # one-time template/packet review per state, USD; above this -> Exceptions Desk
  attorney_per_deal_fee_max: 750  # per-deal contract/assignment review, USD, preferably paid at closing; above this -> Exceptions Desk
  title_fees: paid_at_closing     # title/settlement fees only from closing proceeds on the settlement statement; any up-front title charge -> Exceptions Desk
  field_inspection_fee_max: 150  # owner decision 2026-11-27 (approved): Field Inspections may book a local field agent or inspector up to this per visit (photos + condition checklist, final walk-through); more -> Exceptions Desk
  moving_help_max: 5000           # owner decision 2026-11-27 (approved): moving help ("cash for keys") for an occupant, counted inside MAO, paid only through the title company at closing after a vacant walk-through
  worker_decisions: within_written_limits   # owner decision 2026-11-25: workers decide routine matters (letters, counters within MAO, quotes within the limits above, buyer selection, scheduling, playbook exceptions) and log each in pipeline/decisions-log.csv with its reason
  # Always the owner, not configurable: every signature that company_signature doesn't cover (one click on packets the system prepared); no signature is ever applied for the owner any other way,
  # earnest money (only to a title company's escrow the owner has confirmed by phone, never from emailed instructions), phone calls.
business:                         # who we are. Fill these in once; attorney packets, letters and the dashboard checklist read them.
  legal_name: "Emporium Investments"  # e.g. "Example Holdings LLC"
  entity_state: "IL"  # state of formation
  mailing_address: "208 South LaSalle Street, Suite 814 Chicago Illinois 60604"  # business address printed on letters
  phone: "+1-773-236-7749"  # answered by a person or answering service
  email: "iero@emporium-investments.com"  # business email used for outreach and replies
  website: "https://www.emporium-investments.com"
  signer: "Iyoobsa Ero, Manager - Emporium Investments"  # person who signs contracts for the company
  title_company: ""               # default title company that holds earnest money
  insurance: ""                   # optional: business liability / E&O policy (carrier, policy no., renewal date); doesn't block anything
esignature:                       # e-signature service the Contract Desk sends packets through (agents/contract-desk.md)
  provider: docuseal              # owner's choice 2026-11-22
  connected_on: 2026-11-27                # set when the DocuSeal connector is connected and a test submission works
closing_service:                  # closing-status service the Transaction Coordinator reads (agents/transaction-coordinator.md 4b); read-only, never moves money
  provider: qualia_connect        # works only for title companies that run on Qualia and invite the owner to the order
  connected_on: ""                # set when the owner connects the Qualia Connect connector and an order is visible
earnest_money:
  method: digital_link_preferred  # title company's own digital earnest-money request (Earnnest, Paymints.io, Qualia EMD); wire only if they don't offer one
  # Owner decision 2026-11-25: ask for $0 first (or a token $10-$100 where a contract needs consideration),
  # then the smallest amount the seller accepts, never more than the reserve has free (scripts/reserve.py).
  ask_first: 0
  token_max: 100
  reserve_start: 1000             # USD the owner set aside for earnest money
  reserve_refill_profit_share: 0.25   # at each closing: the deal's earnest money comes back, plus this share of its profit
  normal_deal_share: 0.33         # owner decision 2026-11-25: one deal's deposit is at most a third of the reserve (3 deals at once)
  strong_deal_share: 0.5          # up to half for a deal likely to close (authority verified, buyers matched, margin; scripts/reserve.py)
  strong_min_buyers: 3
  strong_min_margin: 10000        # buyer_max minus our contract price, USD
  refundable_only: true           # earnest money only with an inspection/due-diligence period during which it is refunded
  min_inspection_days: 10
  # Deals needing more than the reserve has free (e.g. a court-set 10% deposit) are passed on or offered to a buyer directly.
company_signature:                # owner decision 2026-11-25: the company signs inside fixed limits; off until both dates are set
  enabled: false                  # the Legal Advisor turns this on only when both dates below are recorded
  resolution_signed_on: ""        # the owner signed the company resolution authorizing its e-signature (one time)
  attorney_confirmed_on: ""       # the attorney confirmed the resolution and this use for the states below
  attorney_confirmed_states: ""   # e.g. "FL,TX"; contracts in other states go to the owner's Sign queue
  documents: purchase_agreement,assignment   # only these, only from attorney-approved templates, only if scripts/sign_check.py passes
bookkeeping:                      # read-only money sources the Bookkeeper imports into pipeline/ledger.csv (agents/bookkeeper.md → Stripe)
  stripe:
    account: acct_1NkV7sAQF4y11zK3   # "Emporium Group", live mode; the whole business, so only tagged transactions are imported
    mode: read_only                # stripe_api_read only; never stripe_api_write, never payouts, transfers or Connect
    tag: probate                   # import a transaction only if its description has this word or a tracker lead id
    connected_on: 2026-11-22       # owner chose read-only bookkeeping (option a); test read passed 2026-11-22
    last_imported: ""              # date of the newest transaction read; next run reads from here
legal_service:                    # attorney review service used by the Legal Advisor (agents/legal-advisor.md → "Attorney review through a connected service")
  provider: general_legal         # connected by the owner 2026-11-22
  connected_on: 2026-11-22
  coverage_matter: 691d3c80-be1b-45cd-b2f2-f9c2ba40d09c   # question: licensed states, wholesale/probate experience, fees, turnaround
  coverage_status: declined       # asked -> answered (then list covered_states) | declined
  declined_on: 2026-11-22         # their attorney: probate matters are outside their expertise; matter closed
  sourcing: professional_network  # owner decision 2026-11-26: the system sources attorneys itself (agents/professional-network.md → Sourcing attorneys)
  covered_states: ""              # e.g. "FL, OH, TX" once they answer
  market_matters: ""              # market-id:matter-id pairs once a packet is submitted
channels:                         # set each to true only once it is actually working
  mail_sending: true             # print-and-mail service connected (letters go out without you)
  email_sending: true            # email sending connected (e.g. the Resend connector)
  inbox_connected: true          # the business mailbox is readable by the daily run
  mail_scanning: false            # a virtual mailbox scans mailed replies and emails them to the business inbox
  voicemail_to_email: false       # the business phone emails voicemail transcripts to the business inbox
  field_inspections: true        # the owner opened a field-inspection service account (card on file there, never here); Field Inspections books visits through it
lead_types:                       # see .claude/skills/probate-wholesale-deal/references/lead-types.md
  probate: true
  post_probate_heirs: true
  small_estate: true
  trust: true
  ancillary: true
  partition: true
  tax_delinquent_inherited: false   # off by owner decision 2026-11-20: too close to a death; families are still mourning
  unprobated: false               # off by owner decision 2026-11-20: too close to a death; families are still mourning
  min_days_after_death: 90        # no first contact for any type until this many days after the date of death (owner decision)
  guardianship: false             # vulnerable adults; only the owner may enable, after the attorney approves a process
max_new_leads_per_day: 25         # deep-dive cap per run; raised automatically toward targets.max_leads_per_day

finance:
  tax_set_aside_pct: 0.30         # Bookkeeper's tax set-aside estimate on net earned (for the CPA; not tax advice)

worker_lifecycle:                 # new workers: trial (shadow) -> active; weak workers: active -> probation -> retired (references/worker-lifecycle.md). Learning may tighten these, never loosen.
  trial_min_runs: 5               # scored shadow runs before promotion
  trial_max_runs: 15              # trial fails after this many runs without meeting the thresholds
  min_accuracy: 0.90              # agreed with the checker / items checked
  max_error_rate: 0.05            # errors / items
  min_yield: 0.25                 # useful results / items
  active_window: 5                # active workers are judged on their last N scored runs
  active_min_accuracy: 0.85       # below this over a full window -> probation
  active_max_error_rate: 0.10
  probation_min_runs: 5
  probation_max_runs: 10          # not recovered by then -> retired (core checkers: owner decides)
  core_workers: compliance-officer quality-auditor exceptions-desk

targets:
  closings_per_month: 20          # stretch goal the planner sizes the funnel for (owner, 2026-11-21; was 3, originally 115)
  closings_floor: 5               # minimum that still counts as a winning month; below it the report flags a problem
  max_leads_per_day: 100          # upper bound the planner may raise max_new_leads_per_day to (owner, 2026-11-21; was 50)
  max_expansion_per_run: 10       # upper bound on new counties tried per run (was 6)
  min_sample_for_measured_rate: 20  # a step uses its own measured rate once it has this many outcomes; fewer -> blended with the assumption below
  assumed_rates:                  # used ONLY for a step with no outcomes yet; each step switches to its measured rate as soon as it has data
    researched_to_opportunity: 0.40
    opportunity_to_conversation: 0.15
    conversation_to_contract: 0.30
    contract_to_close: 0.75
lookback_days_first_run: 90       # first run searches filings from the last N days
legal_recheck_days: 30            # re-verify each state's legal file after N days

defaults:
  buyer_pct: 0.70                 # change per market once real buyers confirm what they pay
  assignment_fee: 10000
  min_equity_pct: 0.30            # skip leads where estimated equity is below this share of value

markets:
  - id: oh-franklin
    county: Franklin
    state: OH
    city: Columbus
    outreach_allowed: true        # still drafts only; Ohio R.C. 5301.95 disclosure must be in every contract
    sources:
      probate_court: https://probate.franklincountyohio.gov
      auditor: https://property.franklincountyauditor.com
      treasurer: https://treasurer.franklincountyohio.gov
      recorder: https://recorder.franklincountyohio.gov
    last_checked: 2026-11-27

  - id: tn-shelby
    county: Shelby
    state: TN
    city: Memphis
    outreach_allowed: true
    sources:
      probate_court: https://www.probatecourt.shelbycountytn.gov   # did not respond on 2026-11-18; try alternates and log
      register_of_deeds: https://register.shelby.tn.us              # rate-limited (429) on 2026-11-18; go slow
      assessor: https://www.assessormelvinburgess.com
      trustee: https://www.shelbycountytrustee.com
    last_checked: 2026-11-19

  - id: pa-philadelphia
    county: Philadelphia
    state: PA
    city: Philadelphia
    outreach_allowed: false       # PA Act 52 of 2024: wholesaling needs a license. Research only until licensed_or_partnered is true.
    licensed_or_partnered: false
    sources:
      register_of_wills: https://www.phila.gov/departments/register-of-wills/
      property: https://property.phila.gov
      courts_portal: https://ujsportal.pacourts.us
    last_checked: 2026-11-19

  - id: tx-harris
    county: Harris
    state: TX
    city: Houston
    outreach_allowed: true        # Texas: written assignment disclosure to seller + contract-interest disclosure to buyers (Prop. Code 5.0205); mail only until attorney answers SB 140 texting question
    sources:
      probate_court: https://www.cclerk.hctx.net/applications/websearch/CourtSearch.aspx?CaseType=Probate
      parcels: https://www.gis.hctx.net/arcgis/rest/services/HCAD/Parcels/MapServer/0
      deeds: https://www.cclerk.hctx.net/applications/websearch/RP.aspx
    last_checked: 2026-11-19

  - id: fl-hillsborough
    county: Hillsborough
    state: FL
    city: Tampa
    outreach_allowed: true        # drafts only; FL Ch. 475 broker-law risk: market the contract only to a private buyer list, never advertise the house; attorney must approve model first; no calls/texts until FL DNC process set up
    sources:
      probate_filings: https://publicrec.hillsclerk.com/Probate/dailyfilings/   # robots.txt on hillsclerk.com sets Crawl-delay 10 for ClaudeBot: wait >=10s between requests
      parcels: https://maps.hillsboroughcounty.org/arcgis/rest/services/PAO/HC_Properties/MapServer/1
    last_checked: 2026-11-27

