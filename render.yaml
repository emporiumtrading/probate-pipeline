# Render blueprint — probate pipeline: dashboard + scheduled runners.
#
# Dashboard: Render dashboard -> New -> Blueprint -> pick this repo, or it was
# already created via `render services create`.
#
# Runners (cron): replicate the claude.ai scheduled sessions on Render —
# headless Claude Code runs the daily-run slices against a fresh repo clone.
# Engines (owner decision 2026-11-25): each run tries Claude first (cheap models), then
# NVIDIA, then OpenRouter free models (both run the whole slice via runner/agent.mjs),
# then the scripted run (no AI). Keys and models are entered on the dashboard's Setup
# page -> "AI engines"; the dashboard saves keys here as env vars through Render's API
# (needs RENDER_API_KEY on probate-dashboard). Never commit key values.
#   ANTHROPIC_API_KEY, NVIDIA_API_KEY, OPENROUTER_API_KEY  (set from the dashboard)
#   GITHUB_TOKEN             (repo scope — clone + push + doc store)
#   RESEND_API_KEY           (optional — inbox/email channels)
# Schedules are UTC (Render has no TZ); CT is UTC-6 in winter, UTC-5 in summer —
# expect a 1h drift during daylight saving unless the cron lines are adjusted.
services:
  - type: web
    name: probate-dashboard
    runtime: node
    plan: free
    buildCommand: python3 scripts/build_dashboard_data.py web/data
    startCommand: node web/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DASHBOARD_USER
        value: owner
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: GITHUB_REPO
        value: emporiumtrading/probate-dashboard-store
      - key: GITHUB_BRANCH
        value: dashboard-store
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false

  # Daily slice A — 5:39 AM CT -> 11:39 UTC (morning: sourcing + deep-dives)
  - type: cron
    name: probate-slice-a
    runtime: node
    plan: starter
    schedule: "39 11 * * *"
    buildCommand: cd runner && npm ci
    startCommand: node runner/run.mjs a
    envVars:
      - {key: PIPELINE_REPO, value: emporiumtrading/probate-pipeline}
      - {key: STORE_REPO, value: emporiumtrading/probate-dashboard-store}
      - {key: STORE_BRANCH, value: dashboard-store}
      - {key: GITHUB_TOKEN, sync: false}
      - {key: ENGINE, value: auto}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: NVIDIA_API_KEY, sync: false}
      - {key: OPENROUTER_API_KEY, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: RENDER_API_KEY, sync: false}   # copied here by the dashboard; used to deploy after each run

  # Daily slice B — 12:23 PM CT -> 18:23 UTC (midday: sourcing + expansion)
  - type: cron
    name: probate-slice-b
    runtime: node
    plan: starter
    schedule: "23 18 * * *"
    buildCommand: cd runner && npm ci
    startCommand: node runner/run.mjs b
    envVars:
      - {key: PIPELINE_REPO, value: emporiumtrading/probate-pipeline}
      - {key: STORE_REPO, value: emporiumtrading/probate-dashboard-store}
      - {key: STORE_BRANCH, value: dashboard-store}
      - {key: GITHUB_TOKEN, sync: false}
      - {key: ENGINE, value: auto}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: NVIDIA_API_KEY, sync: false}
      - {key: OPENROUTER_API_KEY, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: RENDER_API_KEY, sync: false}   # copied here by the dashboard; used to deploy after each run

  # Daily slice C — 5:41 PM CT -> 23:41 UTC (evening: maintenance + day report)
  - type: cron
    name: probate-slice-c
    runtime: node
    plan: starter
    schedule: "41 23 * * *"
    buildCommand: cd runner && npm ci
    startCommand: node runner/run.mjs c
    envVars:
      - {key: PIPELINE_REPO, value: emporiumtrading/probate-pipeline}
      - {key: STORE_REPO, value: emporiumtrading/probate-dashboard-store}
      - {key: STORE_BRANCH, value: dashboard-store}
      - {key: GITHUB_TOKEN, sync: false}
      - {key: ENGINE, value: auto}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: NVIDIA_API_KEY, sync: false}
      - {key: OPENROUTER_API_KEY, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: RENDER_API_KEY, sync: false}   # copied here by the dashboard; used to deploy after each run

  # Fast desk — 8:47,10:47,14:47,16:47,19:47 CT -> 14:47,16:47,20:47,22:47,1:47 UTC
  - type: cron
    name: probate-fast-desk
    runtime: node
    plan: starter
    schedule: "47 1,14,16,20,22 * * *"
    buildCommand: cd runner && npm ci
    startCommand: node runner/run.mjs fast-desk
    envVars:
      - {key: PIPELINE_REPO, value: emporiumtrading/probate-pipeline}
      - {key: STORE_REPO, value: emporiumtrading/probate-dashboard-store}
      - {key: STORE_BRANCH, value: dashboard-store}
      - {key: GITHUB_TOKEN, sync: false}
      - {key: ENGINE, value: auto}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: NVIDIA_API_KEY, sync: false}
      - {key: OPENROUTER_API_KEY, sync: false}
      - {key: RESEND_API_KEY, sync: false}
      - {key: RENDER_API_KEY, sync: false}   # copied here by the dashboard; used to deploy after each run
